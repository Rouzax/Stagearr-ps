# Built with Zensical (requirements-docs.txt), which reads mkdocs.yml natively.
# The config stays in this file on purpose: MkDocs can still build it, so a
# rollback only touches the workflow and the pin.
site_name: Stagearr
site_url: https://rouzax.github.io/Stagearr-ps/docs/
site_description: "Automated media processing pipeline for qBittorrent"
repo_url: https://github.com/Rouzax/Stagearr-ps
repo_name: Rouzax/Stagearr-ps
edit_uri: edit/main/docs/

site_dir: build/docs

theme:
  name: material
  # Zensical's default "modern" variant swaps in different fonts and styling;
  # classic keeps the Material look the site was designed with.
  variant: classic
  logo: assets/brand/stagearr-light.svg
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Feature flags are not validated by the build; check new ones in a browser.
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

# Renders a small icon row in the footer of every page. Icon names resolve against
# the icon sets the theme bundles; an unknown name fails the build.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rouzax/Stagearr-ps
      name: Stagearr on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/O0W221GBUG
      name: Support Stagearr on Ko-fi

# Zensical's recommended extension set (from `zensical new`). An explicit list
# replaces its defaults instead of merging with them, so keep this complete.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Rouzax
      repo: Stagearr-ps
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - qBittorrent Integration: qbittorrent.md
      - Quick Start: quick-start.md
  - How It Works:
      - Pipeline Overview: pipeline.md
      - Video Processing: video-processing.md
      - Subtitle Processing: subtitles.md
      - Importing to Radarr / Sonarr / Medusa: importing.md
      - Email Notifications: email.md
      - Pushover Notifications: pushover.md
      - MDBList Collection Sync: mdblist.md
      - Kodi Library Updates: kodi.md
  - Configuration:
      - Configuration Overview: configuration.md
      - Settings Reference: settings-reference.md
      - Labels & Content Routing: labels.md
  - Operations:
      - CLI Usage & Parameters: cli-usage.md
      - Job Queue & Locking: queue-locking.md
      - Re-running Jobs: rerun.md
      - Auto-Update: updates.md
  - Troubleshooting & FAQ: troubleshooting.md
