name: Build Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release ZIP
        # The top-level entries staged here must match UpdateManagedEntries in
        # Modules/Stagearr.Core/Private/Constants.ps1 (Tests/Release.Tests.ps1 checks this).
        run: |
          stage=build/stage
          mkdir -p "$stage/Assets"
          cp -r Stagearr.ps1 Modules config-sample.toml LICENSE README.md "$stage/"
          cp docs/assets/brand/pushover-128.png docs/assets/brand/stagearr-light-512.png docs/assets/brand/stagearr-dark-512.png "$stage/Assets/"
          (cd "$stage" && zip -r "../Stagearr-v${{ steps.version.outputs.version }}.zip" .)

      - name: Generate checksums
        working-directory: build
        run: sha256sum "Stagearr-v${{ steps.version.outputs.version }}.zip" > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "build/Stagearr-v${{ steps.version.outputs.version }}.zip" \
            "build/checksums.txt" \
            --clobber
